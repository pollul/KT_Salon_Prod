<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Google Sheets Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    #result {
      border: 1px solid #ddd;
      padding: 20px;
      margin-top: 20px;
      white-space: pre-wrap;
    }
    .loading {
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>
  <h1>Google Sheets Access Test</h1>
  <button id="testBtn">Test Google Sheets Access</button>
  <div id="result">Results will appear here</div>

  <script>
    document.getElementById('testBtn').addEventListener('click', function() {
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = '<div class="loading">Loading...</div>';
      
      const sheetID = '1NUt36vkRrYxYPRjzqg3JZXIMD552wA78BvV4lID2Nz4';
      const base = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?`;
      const sheetName = 'Services';
      const query = encodeURIComponent('Select *');
      const url = `${base}&sheet=${sheetName}&tq=${query}`;
      
      fetch(url)
        .then(response => {
          resultDiv.innerHTML += `<p>Response status: ${response.status}</p>`;
          return response.text();
        })
        .then(data => {
          resultDiv.innerHTML += `<p>Raw response (first 300 chars):</p><pre>${data.substring(0, 300)}</pre>`;
          
          try {
            // Find JSON in the response
            const firstBrace = data.indexOf('{');
            const lastBrace = data.lastIndexOf('}');
            
            if (firstBrace === -1 || lastBrace === -1) {
              throw new Error('Cannot find JSON in response');
            }
            
            const jsonStr = data.substring(firstBrace, lastBrace + 1);
            const jsonData = JSON.parse(jsonStr);
            
            resultDiv.innerHTML += `<p>Successfully parsed JSON</p>`;
            resultDiv.innerHTML += `<p>Data structure: ${JSON.stringify(Object.keys(jsonData))}</p>`;
            
            if (jsonData.table && jsonData.table.rows) {
              resultDiv.innerHTML += `<p>Number of rows: ${jsonData.table.rows.length}</p>`;
              
              if (jsonData.table.rows.length > 0) {
                resultDiv.innerHTML += `<p>First row sample: ${JSON.stringify(jsonData.table.rows[0])}</p>`;
              }
            }
          } catch (error) {
            resultDiv.innerHTML += `<p>Error parsing data: ${error.message}</p>`;
          }
        })
        .catch(error => {
          resultDiv.innerHTML = `<p>Error: ${error.message}</p>`;
        });
    });
  </script>
</body>
</html>
