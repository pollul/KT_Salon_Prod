    /* Service type background images */
    .service-header-bg {
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      transition: all 0.3s ease;

    .service-header-bg:before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 40%;
      height: 100%;
      background-size: cover;
      background-position: center;
      opacity: 0.1;
      transition: opacity 0.3s ease;
      z-index: 0;
    }
    
    .service-header-bg:hover:before {
      opacity: 0.2;
    }
    
    .service-header-bg .accordion-button {
      position: relative;
      z-index: 1;
      background: transparent !important;
    }

    .nail-services-bg:before {

    }
    
    .facial-services-bg:before {

    }
    
    .makeup-services-bg:before {

    .waxing-services-bg:before {

    }

    }
    
    /* Service row styling */
    .table tr {
      transition: all 0.2s ease;
    }
    
    .table tr:hover {
      background-color: #f8f9fa;
      transform: translateX(5px);
    }
    
    .table tr td:first-child {
      border-left: 3px solid transparent;
      transition: border-left-color 0.2s ease;
    }
    
    .table tr:hover td:first-child {
      border-left-color: #6c757d;
    }
    
    /* Service icons with animation */
    .service-table-icon {
      transition: transform 0.2s ease;
    }
    
    tr:hover .service-table-icon {
      transform: translateX(3px);
    }
    
    /* Category heading with underline animation */
    .table h2 {
      position: relative;
      display: inline-block;
      padding-bottom: 10px;
    }
    
    .table h2:after {
      content: '';
      position: absolute;
      width: 0;
      height: 2px;
      bottom: 0;
      left: 0;
      background-color: #007bff;
      transition: width 0.3s ease;
    }
    
    .table h2:hover:after {
      width: 100%;

    /* Category icon filtering */

      display: inline-block;

  <script>
    // Custom script to enhance the appearance of dynamically loaded content
    document.addEventListener('DOMContentLoaded', function() {
      console.log('Service page fully loaded');
      
      // Check every second if content has loaded
      const checkInterval = setInterval(function() {
        const tables = document.querySelectorAll('.table');
        console.log('Checking for tables:', tables.length);
        if (tables.length > 0) {
          // Once content is loaded, enhance the appearance
          tables.forEach(function(table) {
            // Add styling to price columns
            const priceCells = table.querySelectorAll('td:nth-child(2)');
            priceCells.forEach(function(cell) {
              cell.classList.add('service-price');
            });
            
            // Add styling to service name columns
            const serviceNameCells = table.querySelectorAll('td:nth-child(1)');
            serviceNameCells.forEach(function(cell) {
              cell.classList.add('service-name');
            });
            
            // Add styling to time columns
            const timeCells = table.querySelectorAll('td:nth-child(3)');
            timeCells.forEach(function(cell) {
              cell.classList.add('service-time');
            });
          });
          
          // Set up event listeners for category icons
          setupCategoryFilters();
          
          console.log('Added styling to service tables');
          clearInterval(checkInterval);
        }
      }, 1000);
    });
    
    // Function to handle category icon clicks for filtering
    function setupCategoryFilters() {
      // Wait for the category icons to be added to the DOM
      setTimeout(() => {
        const categoryIcons = document.querySelectorAll('.category-icon-link');
        
        categoryIcons.forEach(icon => {
          icon.addEventListener('click', function(e) {
            e.preventDefault();
            
            const categoryTitle = this.getAttribute('title').replace('View ', '').replace(' services', '');
            const accordionBody = this.closest('.accordion-body');
            const allRows = accordionBody.querySelectorAll('tr');
            const categoryRow = this.closest('tr');
            
            // Toggle active state
            const isActive = this.classList.contains('active-filter');
            
            // Reset all icons to default state
            accordionBody.querySelectorAll('.category-icon-link').forEach(link => {
              link.classList.remove('active-filter');
              link.querySelector('i').style.color = '';
            });
            
            if (!isActive) {
              // Add active state to clicked icon
              this.classList.add('active-filter');
              this.querySelector('i').style.color = '#007bff';
              
              // Show only service rows matching this category
              let showRows = false;
              allRows.forEach(row => {
                // If it's a category row
                if (row.querySelector('h2')) {
                  // Start showing rows after the clicked category
                  showRows = (row === categoryRow);
                  row.style.display = ''; // Always show category rows
                } 
                // If it's a service row
                else {
                  // If we're showing rows from the current category or if it's a different category
                  if (showRows && !row.querySelector('h2')) {
                    row.style.display = '';
                  } else {
                    row.style.display = 'none';
                  }
                  
                  // Stop showing rows when we hit the next category
                  if (row.querySelector('h2') && row !== categoryRow) {
                    showRows = false;
                  }
                }
              });
            } else {
              // Show all rows if clicking the active filter again
              allRows.forEach(row => {
                row.style.display = '';
              });
            }
          });
        });
      }, 1000);
    }
  </script>
