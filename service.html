  <style>
    :root {
      --primary-color: #6a3093;
      --bg-light: #fcf4f7;
      --text-dark: #333;
      --text-medium: #555;
      --text-light: #777;
      --border-light: #f0f0f0;
      --shadow-regular: 0 4px 12px rgba(0, 0, 0, 0.08);
      --shadow-hover: 0 8px 24px rgba(0, 0, 0, 0.12);
      --font-primary: 'Cormorant Garamond', serif;
      --font-secondary: 'Epilogue', sans-serif;
      --border-radius: 12px;
      --transition: all 0.3s ease;
    }
    
    /* Services Page Main Styles */
    .services-header {
      background-color: var(--bg-light);
      padding: 60px 0;
      margin-bottom: 40px;
      text-align: center;
    }
    
    .services-header h1 {
      color: var(--text-dark);
      font-family: var(--font-primary);
      font-weight: 600;
      margin-bottom: 20px;
    }
    
    .services-header p {
      color: var(--text-medium);
      font-size: 1.2rem;
      max-width: 800px;
      margin: 0 auto;
      font-family: var(--font-secondary);
    }
    
    .services-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 20px 60px;
    }
    
    /* Service Cards and Categories */
    .service-cards-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 30px;
    }
    
    .services-summary {
      text-align: center;
      margin-bottom: 20px;
      font-family: var(--font-secondary);
      color: var(--text-medium);
    }
    
    .services-summary p { font-size: 16px; }
    .services-summary strong { color: var(--text-dark); }
    
    .service-card {
      border-radius: var(--border-radius);
      box-shadow: var(--shadow-regular);
      overflow: hidden;
      background: white;
      transition: var(--transition);
      position: relative;
    }
    
    .service-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-hover);
    }
    
    /* Card Header and Buttons */
    .service-card-button {
      width: 100%;
      background: white;
      border: none;
      padding: 20px 30px;
      display: flex;
      align-items: center;
      text-align: left;
      cursor: pointer;
      font-family: var(--font-secondary);
      font-weight: 600;
      font-size: 18px;
      color: var(--text-dark);
      position: relative;
      z-index: 1;
      transition: var(--transition);
    }
    
    .service-card-button:hover { background-color: rgba(255, 255, 255, 0.9); }
    .service-card-button:focus { outline: none; }
    .service-type-name { margin-left: 15px; flex-grow: 1; }
    
    .toggle-icon {
      transition: transform 0.3s ease;
      font-size: 16px;
      display: inline-block;
    }
    
    .service-card-button.expanded .toggle-icon { transform: rotate(180deg); }
    
    .service-icon {
      font-size: 24px;
      width: 30px;
      text-align: center;
      display: inline-block;
    }
    
    /* Category Styles */
    .service-category {
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-light);
    }
    
    .service-category:last-child {
      border-bottom: none;
      margin-bottom: 0;
    }
    
    .category-header {
      display: flex;
      align-items: center;
      padding: 15px 30px;
      background-color: #fcfcfc;
    }
    
    .category-name {
      margin: 0;
      font-family: var(--font-secondary);
      font-size: 20px;
      font-weight: 600;
      color: #444;
    }
    
    .category-icon {
      display: none;
    }
    
    .category-icon-link {
      text-decoration: none;
      position: relative;
      display: none;
    }
    
    .category-icon-link:hover .category-icon {
      color: var(--primary-color);
      transform: scale(1.2);
    }
    
    .category-icon-link.active-filter .category-icon {
      color: var(--primary-color);
    }
    
    /* Service Item Styles */
    .service-list { padding: 10px 0; }
    
    .service-item {
      padding: 15px 30px;
      transition: var(--transition);
      border-left: 3px solid transparent;
    }
    
    .service-item:hover {
      background-color: rgba(252, 244, 247, 0.5);
      border-left-color: var(--primary-color);
    }
    
    .service-details {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    
    .service-info {
      flex-grow: 1;
      padding-right: 20px;
    }
    
    .service-name {
      font-family: var(--font-secondary);
      font-size: 16px;
      font-weight: 500;
      margin: 0 0 5px 0;
      color: var(--text-dark);
      display: flex;
      align-items: center;
    }
    
    .service-item-icon {
      display: none;
    }
    
    .service-item:hover .service-item-icon {
      transform: translateX(3px);
      color: var(--primary-color);
    }
    
    .service-description {
      margin: 5px 0 0 0;
      font-size: 14px;
      color: var(--text-light);
      font-family: var(--font-secondary);
      font-weight: 300;
    }
    
    .service-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      min-width: 100px;
    }
    
    .service-price {
      font-family: var(--font-secondary);
      font-weight: 600;
      font-size: 18px;
      color: var(--text-dark);
      margin-bottom: 5px;
    }
    
    .service-time {
      font-family: var(--font-secondary);
      font-size: 14px;
      color: #888;
    }
    
    /* Popular Badge */
    .popular-badge {
      display: inline-block;
      font-size: 11px;
      background-color: var(--primary-color);
      color: white;
      padding: 3px 8px;
      border-radius: 30px;
      margin-left: 10px;
      vertical-align: middle;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    
    .popular-service { background-color: rgba(106, 48, 147, 0.05); }
    
    /* Service type background styling */
    .service-header-bg {
      position: relative;
      overflow: hidden;
    }
    
    .service-header-bg:before {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 30%;
      height: 100%;
      background-size: cover;
      background-position: center;
      opacity: 0.1;
      transition: opacity 0.3s ease;
      z-index: 0;
    }
    
    .service-header-bg:hover:before { opacity: 0.15; }
    
    /* Loading Animation */
    .service-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 50px 0;
    }
    
    .service-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(106, 48, 147, 0.1);
      border-radius: 50%;
      border-top-color: var(--primary-color);
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 20px;
    }
    
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .service-loader p {
      font-family: var(--font-secondary);
      color: #666;
    }
    
    /* Error Display */
    .service-error-container {
      display: flex;
      justify-content: center;
      padding: 50px 0;
    }
    
    .service-error {
      max-width: 500px;
      text-align: center;
      padding: 30px;
      border-radius: var(--border-radius);
      background-color: #fff;
      box-shadow: var(--shadow-regular);
    }
    
    .service-error-icon {
      display: none;
    }
    
    .service-error-title, .service-error-message {
      font-family: var(--font-secondary);
      margin-bottom: 10px;
    }
    
    .service-error-title {
      font-weight: 600;
      color: var(--text-dark);
    }
    
    .service-error-message {
      color: #666;
      margin-bottom: 20px;
    }
    
    .service-error-retry {
      border: none;
      background-color: var(--primary-color);
      color: white;
      padding: 10px 20px;
      border-radius: 50px;
      font-family: var(--font-secondary);
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
    }
    
    .service-error-retry:hover {
      background-color: #5a2082;
      transform: translateY(-2px);
    }
    
    /* Responsive Adjustments */
    @media (max-width: 768px) {
      .services-header {
        padding: 40px 0;
      }
      
      .services-header h1 { font-size: 28px; }
      .services-header p { font-size: 16px; }
      .service-card-button { padding: 15px 20px; font-size: 16px; }
      .category-header { padding: 12px 20px; }
      .category-name { font-size: 18px; }
      .service-item { padding: 12px 20px; }
      
      .service-details {
        flex-direction: column;
      }
      
      .service-info {
        padding-right: 0;
        margin-bottom: 10px;
        width: 100%;
      }
      
      .service-meta {
        width: 100%;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
      
      .service-price { margin-bottom: 0; }
    }
    
    @media (max-width: 576px) {
      .services-header h1 { font-size: 24px; }
      .services-header p { font-size: 14px; }
      .service-card-button { padding: 12px 15px; font-size: 15px; }
      .service-name { font-size: 14px; }
      .service-description { font-size: 12px; }
      .service-price { font-size: 15px; }
      .service-time { font-size: 12px; }
      .service-header-bg:before { width: 15%; }
    }
  </style>
</head>
